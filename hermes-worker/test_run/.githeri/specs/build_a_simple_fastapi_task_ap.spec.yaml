task_id: phase1-task-api
summary: "Implement minimal FastAPI Task CRUD API with in-memory store and Pydantic validation"
business_rules:
  - name: "Task title validation"
    formula: "title non-empty string, length <= 200 after strip()"
  - name: "Completed default"
    formula: "completed defaults to false when omitted"
  - name: "Task id positivity"
    formula: "id auto-assigned positive integer"
global_verification:
  - "pytest tests/test_tasks.py"
endpoints:
  - method: POST
    path: /tasks
  - method: GET
    path: /tasks
  - method: GET
    path: /tasks/{task_id}
  - method: PATCH
    path: /tasks/{task_id}
  - method: DELETE
    path: /tasks/{task_id}
local_goals:
  - id: L1
    description: "INSPECT: Check existing main module and test layout"
    type: inspect
    verification:
      type: file_exists
      path: "main.py"
      expect:
        exists: true
  - id: L2
    description: "CREATE: Implement FastAPI app, Task models, and in-memory store in main.py"
    type: create
    blueprint: |
      from fastapi import FastAPI, HTTPException
      from pydantic import BaseModel, Field
      from typing import Optional, List

      app = FastAPI()

      class TaskCreate(BaseModel):
          title: str = Field(..., min_length=1, max_length=200)
          completed: bool = False

      class TaskUpdate(BaseModel):
          title: Optional[str] = Field(None, min_length=1, max_length=200)
          completed: Optional[bool] = None

      class Task(BaseModel):
          id: int
          title: str
          completed: bool = False

      _store: dict = {}
      _counter = 0

      def _reset_store():
          global _store, _counter
          _store = {}
          _counter = 0

      @app.post("/tasks", status_code=201, response_model=Task)
      def create_task(payload: TaskCreate):
          global _counter
          _counter += 1
          task = Task(id=_counter, title=payload.title.strip(), completed=payload.completed)
          _store[task.id] = task
          return task

      @app.get("/tasks", response_model=List[Task])
      def list_tasks():
          return list(_store.values())

      @app.get("/tasks/{task_id}", response_model=Task)
      def get_task(task_id: int):
          if task_id not in _store:
              raise HTTPException(status_code=404, detail="Task not found")
          return _store[task_id]

      @app.patch("/tasks/{task_id}", response_model=Task)
      def update_task(task_id: int, payload: TaskUpdate):
          if task_id not in _store:
              raise HTTPException(status_code=404, detail="Task not found")
          task = _store[task_id]
          if payload.title is not None:
              task.title = payload.title.strip()
          if payload.completed is not None:
              task.completed = payload.completed
          _store[task_id] = task
          return task

      @app.delete("/tasks/{task_id}", status_code=204)
      def delete_task(task_id: int):
          if task_id not in _store:
              raise HTTPException(status_code=404, detail="Task not found")
          del _store[task_id]
          return None
    acceptance_criteria:
      - test: "Task API endpoints respond"
        steps: "Call each route via TestClient"
    verification:
      type: file_exists
      path: "main.py"
      expect:
        exists: true
        content_contains: "FastAPI"
  - id: L3
    description: "VERIFY: Run task API test suite"
    type: verify
    verification:
      type: cli
      command: "pytest tests/test_tasks.py"
      expect:
        exit_code: 0
context:
  language: Python
  framework: FastAPI
  orm: None
  test_framework: pytest